name: library-rsa-lab

hosts:
  - name: seed
    # SEED Ubuntu 20.04 VM used as the student's workstation.
    # !! Adapt "image" to the SEED image registered in YOUR cloud / CyberRangeCZ.
    base_box:
      image: seed
      mgmt_user: ubuntu
    flavor: m1.medium

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: m1.small

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: seed-switch
    cidr: 10.1.33.0/24

net_mappings:
  - host: seed
    network: seed-switch
    ip: 10.1.33.10

router_mappings:
  - router: router
    network: seed-switch
    ip: 10.1.33.1

groups: []
