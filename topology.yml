name: library-rsa-lab

hosts:
  - name: attacker
    base_box:
      image: kali
      mgmt_user: debian
    flavor: standard.small

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: attacker-switch
    cidr: 10.1.27.0/24

net_mappings:
  - host: attacker
    network: attacker-switch
    ip: 10.1.27.23

router_mappings:
  - router: router
    network: attacker-switch
    ip: 10.1.27.1

groups: []
